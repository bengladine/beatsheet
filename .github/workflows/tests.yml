name: Unit tests

# Runs the Vitest suite (tests/) on every push and pull request, so the tests
# keep matching the app instead of silently drifting out of date.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
